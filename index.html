<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('Service Worker registrado com sucesso!', reg);
          if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(granted => {
              if (granted) console.log("Armazenamento persistente ativado.");
            });
          }
        })
        .catch(err => console.error('Erro ao registrar o Service Worker:', err));
    });
  }
</script>

<style>
html{background:#000000}
body{background:#000000;color:#f3f4f6;font-family:'Inter',sans-serif;overflow:hidden;height:100%}
.font-serif{font-family:'Inter',sans-serif}
.snap-feed-container{overflow-y:scroll;height:100vh;height:100dvh;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.snap-feed-container::-webkit-scrollbar{display:none}
.snap-item{margin-bottom:.5rem}
.snap-item:last-child{margin-bottom:4.5rem}
.home-wrap>.snap-item{margin-bottom:0!important}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
.stagger-item{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton-shimmer{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.page-transition{animation:fadeUp .38s cubic-bezier(.16,1,.3,1) forwards}
.frosted-modal-container.hidden{display:none}
.frosted-modal-container{background:rgba(0,0,0,.6)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#modal-opcoes,#tela-lidos{background:rgba(0,0,0,.85)!important;backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2)}
select{color-scheme:dark;background:rgba(255,255,255,.08)!important}
.tab-reg{padding:.5rem 0;font-size:.75rem;letter-spacing:.2em;font-weight:400;color:#9ca3af;background:none;border:none;transition:all .2s;cursor:pointer}
.tab-reg.sm{letter-spacing:.06em}
.tab-reg:hover{color:#e5e7eb}
.tab-reg.ativo{color:#FACC15;font-weight:700;text-shadow:0 0 10px rgba(250,204,21,0.3)}
.frosted-modal{background:rgba(10,10,10,.75);backdrop-filter:blur(28px) saturate(1.2);-webkit-backdrop-filter:blur(28px) saturate(1.2);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border-radius:1.25rem;animation:fadeUp .3s cubic-bezier(.16,1,.3,1) forwards}
.frosted-card{background:rgba(12,12,12,.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09);border-radius:.875rem}
.stats-clean .stats-panel{background:rgba(20,20,20,.52);border:1px solid rgba(255,255,255,.075);border-radius:1rem;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.stats-clean .stats-tile{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:.65rem;padding:.5rem .25rem;width:100%}
.stats-clean .grid-cols-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.stats-clean .stats-heading{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#a3a3a3;font-weight:650}
.stats-clean .stats-month-bar{border-radius:5px 5px 2px 2px;min-height:0;transition:height .25s ease;}
.stats-clean .stats-legend-dot{width:.55rem;height:.55rem;border-radius:999px;display:inline-block;flex-shrink:0}
.stats-clean .stats-track{height:6px;border-radius:999px;background:rgba(255,255,255,.075);overflow:hidden}
.frosted-dock{background:rgba(10,10,10,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:9999px}
.bg-layer{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(10px) saturate(1.2) brightness(.4);transform:scale(1.3);transition:opacity .9s ease}
.bg-layer-custom{filter:none!important;transform:none!important;}
@keyframes bounceSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.animate-bounce-slow{animation:bounceSlow 2s infinite ease-in-out}
.sel-mark{display:none;position:absolute;top:.75rem;right:.75rem;width:1.75rem;height:1.75rem;border-radius:9999px;border:2px solid rgba(255,255,255,.5);align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:transparent;font-size:.9rem;font-weight:700;z-index:2}
.modo-sel .sel-mark{display:flex}
.modo-sel .card-acoes{display:none}
.modo-sel [data-id]{cursor:pointer}
.sel-ativo .sel-mark{background:#FACC15;border-color:#FACC15;color:#000}
.sel-ativo .frosted-card{border-color:#FACC15;box-shadow:0 0 0 2px rgba(250,204,21,.6)}
.seg-btn{padding:.625rem .5rem;font-size:.75rem;border-radius:.5rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#d1d5db;transition:all .15s}
.seg-btn.ativo{background:#fff;color:#000;font-weight:600;border-color:#fff}
.btn-gold-degrade{background:linear-gradient(90deg,#facc15 0%,#fbbf24 52%,#fb923c 100%);color:#000;font-weight:700;transition:all .2s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(250,204,21,0.4);box-shadow:0 4px 16px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.3)}
.text-gold-gradient{background:linear-gradient(90deg,#facc15 0%,#fbbf24 52%,#fb923c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.text-yellow-orange-gradient{background:linear-gradient(90deg,#fef08a 0%,#facc15 42%,#fb923c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@keyframes pulseShimmer {
  0%, 100% { opacity: 1; filter: brightness(1); }
  50% { opacity: 0.4; filter: brightness(0.7); }
}
.o-filled-yellow-orange{display:inline-block;width:.5em;height:.727em;border-radius:.07em;background:linear-gradient(135deg,#facc15 0%,#fb923c 100%);margin:0 .02em 0 -.07em;vertical-align:baseline;flex-shrink:0}
.o-filled-yellow-orange.is-loading { animation: pulseShimmer 1s infinite ease-in-out; }
.dock-tab{font-size:.75rem;padding:.25rem .5rem;color:#9ca3af;position:relative;transition:color .2s;font-weight:500}
.dock-tab:hover{color:#e5e7eb}
.dock-tab.ativo{color:#FACC15;font-weight:700;text-shadow:0 0 12px rgba(250,204,21,0.4)}
.dock-add{
  width:2.75rem;height:2.75rem;border-radius:9999px;
  background:rgba(250,204,21,0.25)!important;backdrop-filter:blur(16px) saturate(1.5);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(250,204,21,0.5)!important;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.4)!important;color:#FACC15!important;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.dock-add:hover,.dock-add:active{background:rgba(250,204,21,0.38)!important;filter:brightness(1.15);transform:scale(1.05)}
.font-obs{font-family:'Inter',sans-serif;font-style:normal;font-weight:400;line-height:1.65}
.opt-sec{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#FACC15;font-weight:700;margin-bottom:.25rem}
.opt-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.875rem;color:#e5e7eb;text-align:left;transition:color .15s}
.opt-row:hover{color:#FACC15}
.opt-chev{color:#6b7280;font-size:1.1rem}
.opt-block{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:.5rem;font-size:.75rem;color:#9ca3af}
.opt-act{align-self:flex-start;font-size:.75rem;color:#FACC15;border:1px solid rgba(250,204,21,.4);border-radius:.5rem;padding:.4rem .8rem;transition:all .15s}
.opt-act:hover{background:#FACC15;color:#000}
.opt-desc{font-size:.7rem;color:#6b7280;padding:.4rem 0 .2rem;line-height:1.4}
:root{
  --glass-surface:rgba(22,22,22,.72);
  --glass-surface-strong:rgba(15,15,15,.88);
  --glass-border:rgba(255,255,255,.12);
  --glass-border-soft:rgba(255,255,255,.075);
  --glass-shadow:0 12px 32px rgba(0,0,0,.28);
}
.frosted-card,.frosted-modal,.frosted-dock,#registro-caixa,#welcome-card,#tela-login-inicial .frosted-card{
  background:var(--glass-surface)!important;
  -webkit-backdrop-filter:blur(24px) saturate(.85)!important;
  backdrop-filter:blur(24px) saturate(.85)!important;
  border:1px solid var(--glass-border)!important;
  box-shadow:var(--glass-shadow)!important;
}
.frosted-card{border-radius:1rem!important}
.frosted-modal{border-radius:1.25rem!important}
.frosted-dock{background:var(--glass-surface-strong)!important;border-color:var(--glass-border-soft)!important}
.frosted-modal-container{background:rgba(0,0,0,.68)!important;-webkit-backdrop-filter:blur(18px)!important;backdrop-filter:blur(18px)!important}
#modal-opcoes,#tela-lidos{background:rgba(8,8,8,.92)!important;-webkit-backdrop-filter:blur(28px) saturate(.85)!important;backdrop-filter:blur(28px) saturate(.85)!important}
.dock-add{width:2.35rem!important;height:2rem!important;border-radius:.65rem!important}
</style>
</head>
<body class="h-full relative select-none">

      <button onclick="conectarGoogleDrive(true)" class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-white text-black font-semibold text-sm hover:bg-gray-100 transition-all shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>

</div>

<header id="app-header" class="fixed top-0 left-0 right-0 z-40 pb-4 px-6 flex justify-between items-center bg-gradient-to-b from-[#000000] via-[#000000]/90 to-transparent pointer-events-none" style="padding-top:calc(1.25rem + env(safe-area-inset-top,0px))">

</div>

<script>
function renderizarTelaConfiguracoes() {

      <div class="max-w-2xl mx-auto px-5 py-4 flex items-center gap-3">

        <h2 class="text-base font-bold text-white font-serif">Configurações</h2>
      </div>
    </div>
    <div class="max-w-2xl mx-auto px-5 pt-4 pb-20 space-y-4">

      <div class="flex items-center justify-between opt-row mt-1">
        <button onclick="conectarGoogleDrive(true)" class="text-left flex-1"><span class="font-semibold text-white">Google Drive</span></button>
        <span id="google-status-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-white/10 text-gray-400 ml-2">Desconectado</span>
      </div>
      </section>
      <section><h3 class="opt-sec">versão v1.0.2</h3>
      <p class="text-gray-200 font-medium pt-1">LID<span class="o-filled-yellow-orange" aria-hidden="true"></span>OLIVROS desenhado por <a href="https://www.instagram.com/alcandenis" target="_blank" rel="noopener noreferrer" class="text-gold-gradient font-bold underline">@alcandenis</a></p></section>

  `;
}

  const m = $('modal-opcoes');
  m.classList.toggle('hidden');
  if(!m.classList.contains('hidden')){
    renderizarTelaConfiguracoes();
    m.scrollTop = 0;
    $('input-usuario-nome').value = usuarioNome;
    atualizarStatusGoogleUI();
  }
}

function toggleModalCloud(){
  const m = $('modal-cloud');
  m.classList.toggle('hidden');
  atualizarStatusGoogleUI();
}

function lsGet(k,d=''){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function lerJSON(k){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[]}catch(e){return[]}}

let biblioteca = lerJSON('minha_biblioteca');
let notasKindle = lerJSON('notas_kindle');
let notas = lerJSON('lido_notas');
let usuarioNome = lsGet('lido_usuario_nome', 'Denis');
let abaAtual = 'inicio';
let cloudSyncAtivo = lsGet('cloud_sync_ativo', 'false') === 'true';
let ultimaVerificacaoNuvem = lsGet('cloud_last_sync', 'Nunca');

const $=id=>document.getElementById(id);

// --- SISTEMA DE BACKUP AUTOMÁTICO E RESOLUÇÃO DE CONFLITOS (MULTI-DISPOSITIVO) ---

function resolverConflitoArrays(localArr, remotoArr) {
  // Estratégia de resolução por timestamp (Last-Write-Wins) e ID único de item
  const mapa = new Map();
  
  // Adiciona itens locais
  (localArr || []).forEach(item => {
    const id = item.id || item.titulo || JSON.stringify(item);
    mapa.set(id, { ...item, _source: 'local' });
  });

  // Funde com remotos comparando updatedAt
  (remotoArr || []).forEach(remoto => {
    const id = remoto.id || remoto.titulo || JSON.stringify(remoto);
    const local = mapa.get(id);
    if (!local) {
      mapa.set(id, { ...remoto, _source: 'remoto' });
    } else {
      const tLocal = new Date(local.updatedAt || 0).getTime();
      const tRemoto = new Date(remoto.updatedAt || 0).getTime();
      if (tRemoto > tLocal) {
        mapa.set(id, { ...remoto, _source: 'remoto' });
      }
    }
  });

  return Array.from(mapa.values()).map(({ _source, ...item }) => item);
}

function iniciarSincronizacaoAutomatica() {
  // Verificações constantes a cada 60 segundos
  setInterval(() => {
    if (cloudSyncAtivo && navigator.onLine) {
      sincronizarNuvem(false);
    }
  }, 60000);

  // Verificação ao focar na aba/aplicativo (mudança de dispositivo/sessão)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cloudSyncAtivo && navigator.onLine) {
      sincronizarNuvem(false);
    }
  });

  // Verificação ao recuperar conexão
  window.addEventListener('online', () => {
    if (cloudSyncAtivo) {
      sincronizarNuvem(false);
    }
  });
}

function sincronizarNuvem(forcarNotificacao = false) {
  if (!cloudSyncAtivo) return;
  
  const agoraStr = new Date().toLocaleString('pt-BR');
  ultimaVerificacaoNuvem = agoraStr;
  lsSet('cloud_last_sync', agoraStr);

  // Simulação de sincronização com resolução inteligente de conflitos multi-dispositivo
  const dadosLocais = {
    biblioteca: lerJSON('minha_biblioteca'),
    notasKindle: lerJSON('notas_kindle'),
    notas: lerJSON('lido_notas'),
    usuarioNome: usuarioNome,
    updatedAt: new Date().toISOString()
  };

  // Armazena estado simulado na nuvem (LocalStorage compartilhado / API Driver)
  const dadosRemotosJson = localStorage.getItem('lidolivros_cloud_backup');
  if (dadosRemotosJson) {
    try {
      const dadosRemotos = JSON.parse(dadosRemotosJson);
      
      // Resolução de conflitos combinando dados de múltiplos dispositivos
      const bibliotecaMesclada = resolverConflitoArrays(dadosLocais.biblioteca, dadosRemotos.biblioteca);
      const notasKindleMesclada = resolverConflitoArrays(dadosLocais.notasKindle, dadosRemotos.notasKindle);
      const notasMesclada = resolverConflitoArrays(dadosLocais.notas, dadosRemotos.notas);

      biblioteca = bibliotecaMesclada;
      notasKindle = notasKindleMesclada;
      notas = notasMesclada;

      lsSet('minha_biblioteca', JSON.stringify(biblioteca));
      lsSet('notas_kindle', JSON.stringify(notasKindle));
      lsSet('lido_notas', JSON.stringify(notas));
    } catch(e) {
      console.error("Erro ao processar conflito na nuvem:", e);
    }
  }

  localStorage.setItem('lidolivros_cloud_backup', JSON.stringify(dadosLocais));
  atualizarStatusGoogleUI();
  
  if (forcarNotificacao) {
    console.log('Sincronização concluída com sucesso!');
  }
}

function conectarGoogleDrive(forcar = false) {
  cloudSyncAtivo = true;
  lsSet('cloud_sync_ativo', 'true');
  sincronizarNuvem(true);
  
  if ($('tela-login-inicial')) {
    $('tela-login-inicial').classList.add('hidden');
  }
  atualizarStatusGoogleUI();
}

function continuarSemSalvar() {
  cloudSyncAtivo = false;
  lsSet('cloud_sync_ativo', 'false');
  if ($('tela-login-inicial')) {
    $('tela-login-inicial').classList.add('hidden');
  }
}

function atualizarStatusGoogleUI() {
  const badgeModal = $('cloud-modal-badge');
  const badgeConfig = $('google-status-badge');
  const lastSyncEl = $('cloud-modal-last-sync');
  const btnSync = $('cloud-sync-agora');
  const btnReconectar = $('cloud-reconectar');
  const cloudIcon = $('header-cloud-icon');

  if (cloudSyncAtivo) {
    if (badgeModal) { badgeModal.textContent = 'Conectado'; badgeModal.className = 'font-bold px-2.5 py-0.5 rounded-full text-[10px] bg-green-500/20 text-green-400'; }
    if (badgeConfig) { badgeConfig.textContent = 'Conectado'; badgeConfig.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full bg-green-500/20 text-green-400 ml-2'; }
    if (lastSyncEl) { lastSyncEl.textContent = ultimaVerificacaoNuvem; }
    if (btnSync) btnSync.classList.remove('hidden');
    if (btnReconectar) btnReconectar.classList.add('hidden');
    if (cloudIcon) cloudIcon.style.opacity = '1';
  } else {
    if (badgeModal) { badgeModal.textContent = 'Desconectado'; badgeModal.className = 'font-bold px-2.5 py-0.5 rounded-full text-[10px] bg-white/10 text-gray-400'; }
    if (badgeConfig) { badgeConfig.textContent = 'Desconectado'; badgeConfig.className = 'text-[10px] font-bold px-2.5 py-1 rounded-full bg-white/10 text-gray-400 ml-2'; }
    if (lastSyncEl) { lastSyncEl.textContent = 'Nunca'; }
    if (btnSync) btnSync.classList.add('hidden');
    if (btnReconectar) btnReconectar.classList.remove('hidden');
    if (cloudIcon) cloudIcon.style.opacity = '0.5';
  }
}

function salvarNomeUsuario() {
  const val = $('input-usuario-nome').value.trim();
  if (val) {
    usuarioNome = val;
    lsSet('lido_usuario_nome', usuarioNome);
    sincronizarNuvem(false);
    alert('Perfil atualizado com sucesso!');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (lsGet('lido_usuario_nome')) {
    usuarioNome = lsGet('lido_usuario_nome');
  }
  if (cloudSyncAtivo && $('tela-login-inicial')) {
    $('tela-login-initial').classList.add('hidden');
  }
  iniciarSincronizacaoAutomatica();
  atualizarStatusGoogleUI();
});
</script>
